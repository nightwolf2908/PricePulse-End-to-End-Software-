services:
  postgres_db:
    image: postgres:15-alpine
    container_name: pricepulse_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pricepulse_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: pricepulse_celery_worker
    restart: always
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: pricepulse_celery_beat
    restart: always
    command:
      - celery
      - -A
      - celery_app
      - beat
      - --loglevel=info
      - --schedule=/data/celerybeat-schedule
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - celery_beat_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pricepulse_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pricepulse_frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pricepulse_migrate
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  celery_beat_data:
