name: Pruebas de PricePulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pricepulse_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse_test -d pricepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pricepulse_test:password_test@localhost:5432/pricepulse_test
      JWT_SECRET: secreto-exclusivo-para-pruebas-automaticas
      PYTHONPATH: .

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Ejecutar pruebas
        run: pytest

  deploy:
    name: Desplegar en EC2
    needs: pruebas

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: pricepulse-production
      cancel-in-progress: false

    steps:
      - name: Obtener permiso temporal de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preparar orden de despliegue
        run: |
          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /home/ubuntu/PricePulse-End-to-End-Software-",
              "sudo -u ubuntu git pull --ff-only origin main",
              "docker compose --profile production up -d --build --remove-orphans",
              "docker compose --profile production ps",
              "curl --fail --silent --show-error https://abdiel2908.com/api/health"
            ]
          }
          JSON

      - name: Enviar despliegue a EC2
        id: enviar
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Despliegue de PricePulse desde GitHub Actions" \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Comando enviado: $COMMAND_ID"

      - name: Esperar y mostrar resultado
        env:
          COMMAND_ID: ${{ steps.enviar.outputs.command_id }}
        run: |
          while true; do
            STATUS=$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "Status" \
                --output text
            )

            echo "Estado: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{
              Estado: Status,
              Salida: StandardOutputContent,
              Error: StandardErrorContent
            }"

          test "$STATUS" = "Success"