name: Pruebas de PricePulse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pricepulse_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse_test -d pricepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pricepulse_test:password_test@localhost:5432/pricepulse_test
      JWT_SECRET: secreto-exclusivo-para-pruebas-automaticas
      PYTHONPATH: .

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Ejecutar pruebas
        run: pytest